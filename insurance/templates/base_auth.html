{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Insurance Broker Portal{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'insurance/css/autumn-theme.css' %}">

    <style>
        body.auth-body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, var(--autumn-cream) 0%, var(--autumn-cream-deep) 100%);
            color: var(--autumn-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .auth-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-toasts {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .auth-toast {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 500;
            background: rgba(255, 252, 246, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid var(--autumn-glass-border);
            color: var(--autumn-ink);
            border-left: 4px solid var(--autumn-amber);
        }
        .auth-toast.error { border-left-color: #b91c1c; }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body class="auth-body">
    <div class="auth-shell">
        {% if messages %}
        <div class="auth-toasts">
            {% for message in messages %}
            <div class="auth-toast {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
