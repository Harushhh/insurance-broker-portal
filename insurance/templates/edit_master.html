{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; padding: 30px;">
    <h2 style="margin-top:0;">✏️ {{ title }}</h2>
    <p class="subtext">Update the cluster string. Separate multiple values with commas.</p>
    
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:16px;">
            {% for field in form %}
                <div>
                    <label style="font-weight:700; font-size:12px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; display:block;">
                        {{ field.label }}
                    </label>
                    {{ field }}
                </div>
            {% endfor %}
        </div>
        
        <div style="display:flex; gap:10px; margin-top:24px;">
            <button type="submit" class="btn primary" style="background: linear-gradient(135deg, #10b981, #059669);">Save Changes</button>
            <a href="{% url back_url %}" class="btn">Cancel</a>
        </div>
    </form>
</div>

<style>
    /* Clean up the default Django form inputs */
    input[type="text"], textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-family: inherit;
        font-size: 14px;
        background-color: #f8fafc;
    }
    textarea { min-height: 100px; resize: vertical; }
</style>
{% endblock %}
