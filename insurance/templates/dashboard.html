<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }
        th {
            background: #222;
            color: white;
            position: sticky;
            top: 0;
        }
    </style>
</head>
<body>

<h2>Rate Master Dashboard</h2>

<table>
    <tr>
        {% for key in data.0.keys %}
            <th>{{ key }}</th>
        {% endfor %}
    </tr>

    {% for row in data %}
    <tr>
        {% for value in row.values %}
            <td>{{ value }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>

</body>
</html>
