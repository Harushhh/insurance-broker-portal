<div id="ticketModal" class="modal" tabindex="-1" style="display: none; background: rgba(0,0,0,0.6); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal-dialog" style="background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 500px;">
        <div class="modal-content border-0">
            <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center mb-2">
                <h5 class="modal-title fw-bold">Raise a Ticket</h5>
                <button type="button" class="btn-close" onclick="closeTicketModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info py-2 px-3 small border-0">
                    <i class="bi bi-info-circle"></i> The parameters currently entered in the search form will automatically be attached to this ticket.
                </div>
                <div class="mb-3">
                    <label for="ticketType" class="form-label fw-bold">Ticket Type</label>
                    <select id="ticketType" class="form-select">
                        <option value="">Select...</option>
                        <option value="WRONG_RATE">Wrong Rate</option>
                        <option value="DOUBLE_RATE">Double Rate</option>
                        <option value="MISSING_RATE">Missing Rate</option>
                        <option value="OTHERS">Others</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="ticketInsurer" class="form-label fw-bold">Insurer</label>
                    <select id="ticketInsurer" class="form-select">
                        <option value="">Select...</option>
                        {% for insurer in insurer_list %}
                            <option value="{{ insurer }}">{{ insurer }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="ticketRemarks" class="form-label fw-bold">Remarks / Issue Details</label>
                    <textarea id="ticketRemarks" class="form-control" rows="4" placeholder="Please explain what is missing or incorrect with the current rates..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" onclick="closeTicketModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitTicket()">Submit Ticket</button>
            </div>
        </div>
    </div>
</div>
