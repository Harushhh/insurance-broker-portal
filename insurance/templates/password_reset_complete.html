{% extends "base.html" %}
{% block title %}Password Updated{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="icon-circle success-circle">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h3 style="font-size: 24px; color: #0f172a; margin: 0 0 12px;">Password Updated!</h3>
        <p style="color: #64748b; font-size: 15px; margin: 0 0 30px; line-height: 1.6;">
            Your password has been successfully changed. You can now use your new password to access the Broker Portal.
        </p>
        
        <a href="{% url 'login' %}" class="btn-submit" style="text-decoration: none;">
            Proceed to Login &rarr;
        </a>
    </div>
</div>

<style>
    .auth-page-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
    .auth-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12); border: 1px solid #f1f5f9; }
    .icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; margin-bottom: 20px; }
    .success-circle { background: #f0fdf4; color: #16a34a; }
    .icon-circle svg { width: 36px; height: 36px; }
    .btn-submit { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .btn-submit:hover { box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); transform: translateY(-1px); }
</style>
{% endblock %}
