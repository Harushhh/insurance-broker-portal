<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body{font-family:Arial;background:#f6f7fb;display:flex;justify-content:center;align-items:center;height:100vh;}
    .card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.1);width:360px;}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0;}
    button{width:100%;padding:10px;border:none;border-radius:8px;background:#0b5ed7;color:#fff;font-weight:700;}
    .err{color:#b00020;font-size:13px;}
  </style>
</head>
<body>
  <form method="post" class="card">
    {% csrf_token %}
    <h2>Employee Login</h2>

    {% if form.errors %}
      <div class="err">Invalid username or password</div>
    {% endif %}

    {{ form.username }}
    {{ form.password }}

    <button type="submit">Login</button>
  </form>
</body>
</html>
