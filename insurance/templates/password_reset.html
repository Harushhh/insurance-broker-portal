{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon-circle">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
                </svg>
            </div>
            <h3>Reset Password</h3>
            <p>Enter your email address to securely reset your password.</p>
        </div>

        {% if error %}
            <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'password_reset' %}" class="auth-form">
            {% csrf_token %}
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <input type="email" name="email" required placeholder="name@company.com">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                Continue
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:16px; height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            <a href="{% url 'login' %}">&larr; Back to Secure Login</a>
        </div>
    </div>
</div>

<style>
    .auth-page-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
    .auth-card { background: #ffffff; width: 100%; max-width: 440px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12); border: 1px solid #f1f5f9; }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: #eff6ff; color: #2563eb; border-radius: 50%; margin-bottom: 16px; }
    .icon-circle svg { width: 30px; height: 30px; }
    .auth-header h3 { font-size: 24px; color: #0f172a; margin: 0 0 8px; }
    .auth-header p { color: #64748b; font-size: 14.5px; margin: 0; line-height: 1.5; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
    .input-icon-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 16px; width: 20px; height: 20px; color: #94a3b8; }
    .input-icon-wrap input { width: 100%; padding: 14px 16px 14px 46px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; color: #0f172a; background: #f8fafc; transition: all 0.2s ease; box-sizing: border-box; font-family: inherit; }
    .input-icon-wrap input:focus { outline: none; border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .btn-submit { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .btn-submit:hover { box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); transform: translateY(-1px); }
    .auth-footer { text-align: center; margin-top: 24px; }
    .auth-footer a { color: #64748b; font-size: 14px; font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .auth-footer a:hover { color: #0f172a; }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; margin-bottom: 20px; text-align: center;}
</style>
{% endblock %}
