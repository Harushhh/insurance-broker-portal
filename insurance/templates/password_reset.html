{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="icon-circle">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
                </svg>
            </div>
            <h3>Reset Password</h3>
            <p>Enter your email address to securely reset your password.</p>
        </div>

        {% if error %}
            <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'password_reset' %}" class="auth-form">
            {% csrf_token %}
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-icon-wrap">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <input type="email" name="email" required placeholder="name@company.com">
                </div>
            </div>
            
            <button type="submit" class="btn-submit">
                Continue
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:16px; height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            <a href="{% url 'login' %}">&larr; Back to Secure Login</a>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'insurance/css/pages/password_reset.css' %}">
{% endblock %}
