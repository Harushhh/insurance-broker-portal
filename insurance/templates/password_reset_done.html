{% extends "base.html" %}
{% block title %}Check Your Inbox{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="icon-circle success-circle">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path>
            </svg>
        </div>
        <h3 style="font-size: 24px; color: #0f172a; margin: 0 0 12px;">Check Your Inbox</h3>
        <p style="color: #64748b; font-size: 15px; margin: 0 0 30px; line-height: 1.6;">
            We've sent a secure password reset link to your email address. Please click the link to continue.
        </p>
        
        <a href="{% url 'login' %}" class="btn-submit" style="text-decoration: none;">Return to Login</a>
    </div>
</div>

<style>
    .auth-page-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
    .auth-card { background: #ffffff; width: 100%; max-width: 440px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12); border: 1px solid #f1f5f9; }
    .icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; margin-bottom: 20px; }
    .success-circle { background: #f0fdf4; color: #16a34a; }
    .icon-circle svg { width: 32px; height: 32px; }
    .btn-submit { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-sizing: border-box; }
    .btn-submit:hover { background: #e2e8f0; }
</style>
{% endblock %}
